name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          sudo python3 -m pip install --break-system-packages --upgrade "clang-format==21.*"
          hash -r
          clang-format --version
      - name: Verify C++ formatting
        run: |
          find Core DAL Samples Startup \( -name '*.ixx' -o -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run -Werror

  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --cap-add=SYS_PTRACE
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-release, gcc-asan]

    steps:
      - name: Install toolchain (GCC 16.2+, CMake 4.5+, Ninja, SQLite)
        run: |
          pacman -Syu --noconfirm --needed gcc git cmake ninja sqlite
          g++ --version
          cmake --version

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset build-${{ matrix.preset }} -j 2

      - name: Test (${{ matrix.preset }})
        run: ctest --preset test-${{ matrix.preset }} --output-on-failure

  contracts-and-packaging:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install toolchain (GCC 16.2+, CMake 4.5+, Ninja, SQLite)
        run: |
          pacman -Syu --noconfirm --needed gcc git cmake ninja sqlite
          g++ --version
          cmake --version

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure, build, and test with P2900 contracts enabled
        run: |
          cmake -S . -B build-contracts -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCODEFIRST_ENABLE_CONTRACTS=ON
          cmake --build build-contracts -j 2
          ctest --test-dir build-contracts --output-on-failure

      - name: Configure, build, and test Debug with CODEFIRST_ENABLE_STACKTRACE=OFF (no libstdc++exp)
        run: |
          cmake -S . -B build-no-trace -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCODEFIRST_ENABLE_STACKTRACE=OFF
          cmake --build build-no-trace -j 2
          ctest --test-dir build-no-trace --output-on-failure
          if grep -q "stdc++exp" build-no-trace/build.ninja; then
            echo "ERROR: libstdc++exp should not be linked when CODEFIRST_ENABLE_STACKTRACE=OFF and CODEFIRST_ENABLE_CONTRACTS=OFF"
            exit 1
          fi

      - name: Install, relocate prefix, verify licenses, and test find_package consumer
        run: |
          cmake -S . -B build-install -G Ninja -DCMAKE_BUILD_TYPE=Release -DCODEFIRST_BUILD_TESTS=OFF -DCODEFIRST_BUILD_EXAMPLES=OFF -DCODEFIRST_INCLUDE_SAMPLES=OFF -DCODEFIRST_INSTALL=ON -DCMAKE_INSTALL_PREFIX=/tmp/cf_prefix
          cmake --build build-install -j 2
          if grep -q "stdc++exp" build-install/build.ninja; then
            echo "ERROR: libstdc++exp should not be linked in Release builds"
            exit 1
          fi
          cmake --install build-install
          for lic in LICENSE LICENSE.sqlgen LICENSE.reflect-cpp LICENSE.yyjson; do
            test -f "/tmp/cf_prefix/share/licenses/CodeFirstCppDB/$lic"
          done
          rm -rf /tmp/cf_relocated_prefix
          mv /tmp/cf_prefix /tmp/cf_relocated_prefix
          mkdir -p /tmp/cf_consumer
          cat <<'EOF' > /tmp/cf_consumer/CMakeLists.txt
          cmake_minimum_required(VERSION 4.5)
          project(consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 26)
          set(CMAKE_CXX_MODULE_STD ON)
          set(CMAKE_CXX_SCAN_FOR_MODULES ON)
          find_package(CodeFirstCppDB CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE CodeFirstCppDB::Core CodeFirstCppDB::DAL)
          EOF
          cat <<'EOF' > /tmp/cf_consumer/main.cpp
          import std;
          import codefirst.core;
          import codefirst.dal;
          int main()
          {
              auto conn = DAL::SQLiteConnection::connect(":memory:");
              return conn ? 0 : 1;
          }
          EOF
          cmake -S /tmp/cf_consumer -B /tmp/cf_consumer/build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/cf_relocated_prefix
          cmake --build /tmp/cf_consumer/build -j 2
          /tmp/cf_consumer/build/consumer

      - name: Verify CODEFIRST_LEGACY_MODULE_ALIASES=OFF collision-free consumer & CMake isolation
        run: |
          mkdir -p /tmp/cf_no_legacy_consumer
          cat <<EOF > /tmp/cf_no_legacy_consumer/CMakeLists.txt
          cmake_minimum_required(VERSION 4.5)
          project(no_legacy_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 26)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(CMAKE_CXX_SCAN_FOR_MODULES ON)
          set(CMAKE_CXX_MODULE_STD ON)
          set(CODEFIRST_LEGACY_MODULE_ALIASES OFF CACHE BOOL "" FORCE)
          add_subdirectory("$GITHUB_WORKSPACE" codefirst_dep)
          # Verify vendored reflectcpp_DIR / SQLite3_DIR stubs did not pollute parent CMake cache.
          get_property(_rfl_cached CACHE reflectcpp_DIR PROPERTY VALUE)
          get_property(_sql_cached CACHE SQLite3_DIR PROPERTY VALUE)
          if(_rfl_cached MATCHES "_codefirst_cmake_stubs" OR _sql_cached MATCHES "_codefirst_cmake_stubs")
              message(FATAL_ERROR "CodeFirstCppDB leaked stub DIR paths into parent CMake cache")
          endif()
          # Consumer defines its own 'export module core;' with zero collision!
          add_library(app_core STATIC)
          target_sources(app_core PUBLIC FILE_SET CXX_MODULES FILES app_core.ixx)
          add_executable(no_legacy_app main.cpp)
          target_link_libraries(no_legacy_app PRIVATE app_core CodeFirstCppDB::DAL)
          EOF
          cat <<'EOF' > /tmp/cf_no_legacy_consumer/app_core.ixx
          export module core;
          export namespace AppCore
          {
              constexpr int magic() noexcept { return 42; }
          }
          EOF
          cat <<'EOF' > /tmp/cf_no_legacy_consumer/main.cpp
          import std;
          import core;
          import codefirst.core;
          import codefirst.dal;
          int main()
          {
              auto conn = DAL::SQLiteConnection::connect(":memory:");
              return (conn.has_value() && AppCore::magic() == 42) ? 0 : 1;
          }
          EOF
          cmake -S /tmp/cf_no_legacy_consumer -B /tmp/cf_no_legacy_consumer/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/cf_no_legacy_consumer/build -j 2
          /tmp/cf_no_legacy_consumer/build/no_legacy_app

      - name: Verify external add_subdirectory multi-module consumer (legacy aliases ON)
        run: |
          mkdir -p /tmp/cf_subdir_consumer
          cat <<EOF > /tmp/cf_subdir_consumer/CMakeLists.txt
          cmake_minimum_required(VERSION 4.5)
          project(subdir_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 26)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(CMAKE_CXX_SCAN_FOR_MODULES ON)
          set(CMAKE_CXX_MODULE_STD ON)
          add_subdirectory("$GITHUB_WORKSPACE" codefirst_dep)
          # Non-DAL sibling module verifying CodeFirstCppDB::Core does not leak BMI flags onto unrelated modules.
          add_library(plain_mod STATIC)
          target_sources(plain_mod PUBLIC FILE_SET CXX_MODULES FILES plain.ixx)
          target_link_libraries(plain_mod PUBLIC CodeFirstCppDB::Core)
          # DAL-consuming module importing both core and dal.
          add_library(data_mod STATIC)
          target_sources(data_mod PUBLIC FILE_SET CXX_MODULES FILES data.ixx)
          target_link_libraries(data_mod PUBLIC CodeFirstCppDB::DAL plain_mod)
          add_executable(subdir_consumer main.cpp)
          target_link_libraries(subdir_consumer PRIVATE plain_mod data_mod)
          EOF
          cat <<'EOF' > /tmp/cf_subdir_consumer/plain.ixx
          export module plain;
          import std;
          import core;
          export namespace Plain
          {
              struct Tag {};
              using PlainId = Core::Id<Tag, std::int32_t>;
              inline PlainId make_id(std::int32_t v) noexcept { return PlainId{ v }; }
          }
          EOF
          cat <<'EOF' > /tmp/cf_subdir_consumer/data.ixx
          export module data;
          import std;
          import dal;
          import plain;
          export namespace Data
          {
              inline bool check_db()
              {
                  auto conn = DAL::SQLiteConnection::connect(":memory:");
                  return conn.has_value() && Plain::make_id(7).get() == 7;
              }
          }
          EOF
          cat <<'EOF' > /tmp/cf_subdir_consumer/main.cpp
          import plain;
          import data;
          int main()
          {
              return Data::check_db() && Plain::make_id(1).get() == 1 ? 0 : 1;
          }
          EOF
          cmake -S /tmp/cf_subdir_consumer -B /tmp/cf_subdir_consumer/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/cf_subdir_consumer/build -j 2
          /tmp/cf_subdir_consumer/build/subdir_consumer

      - name: Verify CODEFIRST_SQLITE_TARGET injection consumer
        run: |
          mkdir -p /tmp/cf_injected_sqlite
          cat <<EOF > /tmp/cf_injected_sqlite/CMakeLists.txt
          cmake_minimum_required(VERSION 4.5)
          project(injected_sqlite_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 26)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(CMAKE_CXX_SCAN_FOR_MODULES ON)
          set(CMAKE_CXX_MODULE_STD ON)
          find_library(SYS_SQLITE3_LIB sqlite3 REQUIRED)
          find_path(SYS_SQLITE3_INC sqlite3.h REQUIRED)
          add_library(custom_sqlite INTERFACE)
          target_include_directories(custom_sqlite INTERFACE "\${SYS_SQLITE3_INC}")
          target_link_libraries(custom_sqlite INTERFACE "\${SYS_SQLITE3_LIB}")
          set(CODEFIRST_SQLITE_TARGET custom_sqlite CACHE STRING "" FORCE)
          add_subdirectory("$GITHUB_WORKSPACE" codefirst_dep)
          add_executable(injected_app main.cpp)
          target_link_libraries(injected_app PRIVATE CodeFirstCppDB::DAL)
          EOF
          cat <<'EOF' > /tmp/cf_injected_sqlite/main.cpp
          import std;
          import dal;
          int main()
          {
              auto conn = DAL::SQLiteConnection::connect(":memory:");
              return conn ? 0 : 1;
          }
          EOF
          cmake -S /tmp/cf_injected_sqlite -B /tmp/cf_injected_sqlite/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/cf_injected_sqlite/build -j 2
          /tmp/cf_injected_sqlite/build/injected_app
