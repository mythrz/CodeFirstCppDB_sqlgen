name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-asan]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GCC 16 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common ninja-build libsqlite3-dev
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16

      - name: Configure (${{ matrix.preset }})
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset build-${{ matrix.preset }}

      - name: Test (${{ matrix.preset }})
        run: ctest --preset test-${{ matrix.preset }} --output-on-failure
